server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smarttrip-backend
  data:
    mongodb:
      uri: mongodb://localhost:27017/smarttrip_db
      auto-index-creation: true


app:
  jwt:
    # Set the JWT_SECRET environment variable in your shell before running the app.
    secret: ${JWT_SECRET:CHANGE_ME_dev_only_do_not_use_in_production}
    expiration-ms: 86400000
  groq:
    api-key: ${GROQ_API_KEY:}
    endpoint: https://api.groq.com/openai/v1/chat/completions
    model: openai/gpt-oss-120b
logging:
  level:
    root: INFO
    com.smarttrip: DEBUG